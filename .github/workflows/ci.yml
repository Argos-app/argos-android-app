name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master
      - development

permissions:
  contents: read

jobs:
  test-build:
    name: Build and Test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Validate google-services.json
        env:
          GOOGLE_SERVICES_JSON_B64: ${{ secrets.GOOGLE_SERVICES_JSON_B64 }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON_B64" ]; then
            echo "$GOOGLE_SERVICES_JSON_B64" | base64 --decode > "$RUNNER_TEMP/google-services.json"
            python -m json.tool "$RUNNER_TEMP/google-services.json" > /dev/null
            if python -c 'import json, sys; data=json.load(open(sys.argv[1])); sys.exit(0 if any(c.get("client_info", {}).get("android_client_info", {}).get("package_name") == "com.android.argosapp" for c in data.get("client", [])) else 1)' "$RUNNER_TEMP/google-services.json"; then
              cp "$RUNNER_TEMP/google-services.json" app/google-services.json
            else
              echo "::warning title=Invalid Firebase config::GOOGLE_SERVICES_JSON_B64 does not contain a client for com.android.argosapp. Using the checked-in configuration."
            fi
          else
            echo "::notice title=Using checked-in Firebase config::GOOGLE_SERVICES_JSON_B64 is not set; using app/google-services.json from the repository."
          fi

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/
          retention-days: 7

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7
